name: Generate Allure report

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run tests on'
        required: true
        default: 'develop'

jobs:
  test-by-test-suite:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.branch || github.ref }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt allure-pytest

    - name: Update token
      run: |
        python ./src/utils/update_token_config.py

    - name: Run tests with Allure
      run: |
        mkdir -p test-results/allure-results
        PYTHONPATH=$PYTHONPATH:. pytest -v --alluredir=test-results/allure-results || true

    - name: Generate Allure HTML report
      run: |
        pip install allure-python-commons
        wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz -O allure.tgz
        tar -xvzf allure.tgz
        ./allure-2.29.0/bin/allure generate test-results/allure-results -o test-results/allure-report --clean

    - name: Upload Allure report as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: test-results/allure-report

jobs:
  test-by-mark:
    runs-on: ubuntu-latest
    needs: builest-by-test-suite

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.branch || github.ref }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pytest-html

    - name: Update token
      run: |
        python ./src/utils/update_token_config.py

    - name: Run tests by marker and generate reports
      run: |
        mkdir -p test-results
        for marker in smoke regression funcional negativo positivo seguridad rendimiento valor_limite e2e; do
          echo "Running tests with marker: $marker"
          python -m pytest -v -m "$marker" \
            --html="test-results/report_${marker}.html" --self-contained-html || true
        done

    - name: Upload test results as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-reports
        path: test-results/

